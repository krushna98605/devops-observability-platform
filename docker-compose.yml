
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-observability-platform:1.0
    container_name: devops-observability-app
    ports:
      - "3000:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: devops-observability-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: devops-observability-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in your environment}"

      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp-relay.brevo.com:587"
      GF_SMTP_USER: "bf9b2b001@smtp-brevo.com"
      GF_SMTP_PASSWORD: "${GF_SMTP_PASSWORD:?Set GF_SMTP_PASSWORD in your environment}"
      GF_SMTP_FROM_ADDRESS: "krushnamaswadkar@gmail.com"
      GF_SMTP_FROM_NAME: "DevOps Observability"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"

    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
